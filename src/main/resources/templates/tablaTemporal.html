<html xmlns:th="http://www.thymeleaf.org">

<table class="table" th:fragment="tabla">
    <thead style="width:100%;">
        <tr th:if="${prestamos}" class="header">
        <th scope="col" class="frame-7"><div class="text-wrapper-7">Id<div></th>
                    <th scope="col" class="frame-7" ><div class="text-wrapper-7">Estado</div></th>
                    <th scope="col" class="frame-7"><div class="text-wrapper-7">Fecha inicio</div></th>
                    <th scope="col" class="frame-7"><div class="text-wrapper-7">Fecha devolucion</div></th>
                    <th scope="col" class="frame-8"><div class="text-wrapper-7" >Codigo del recurso</div></th>
                    <th scope="col" class="frame-8"><div class="text-wrapper-7">Título del recurso</div></th>
    </tr>
    <tr th:if="${reservas}" class="header">
        <th scope="col" class="frame-8"><div class="text-wrapper-7">Código de reserva</div></th>
        <th scope="col" class="frame-7"><div class="text-wrapper-7">Fecha de reserva</div></th>
        <th scope="col" class="frame-7"><div class="text-wrapper-7">Fecha límite de retiro</div></th>
        <th scope="col" class="frame-7"><div class="text-wrapper-7">Estado</div></th>
        <th scope="col" class="frame-7"><div class="text-wrapper-7">Posición cola</div></th>
        
    </tr>
    </thead>
    <tbody style="width:100%;">

        <tr th:if="${prestamos}" th:each="prestamo : ${prestamos}" class="row">
            <th scope="row"  class="frame-7"><div class="text-wrapper-8" th:text="${prestamo.id}"></div></th>
            <td class="frame-7"><div class="text-wrapper-8"  th:text="${prestamo.estado ? 'Activo' : 'Inactivo'}"></div></td>
        <td class="frame-7"><div class="text-wrapper-8"  th:text="${prestamo.fechaAdquisicion}"></div></td>
        <td class="frame-7"><div class="text-wrapper-8"  th:text="${prestamo.fechaDevolucion}"></div></td>
        <td  class="frame-8"><div class="text-wrapper-8"  th:text="${prestamo.recursoBibliografico.codigoDeBarras}"></div></td>
        <td class="frame-8"><div class="text-wrapper-8"  th:text="${prestamo.recursoBibliografico.titulo}" ></div></td>
    </tr>
    <tr th:if="${reservas}" th:each="reserva : ${reservas}" class="row">
        <th scope="row" class="frame-8"><div class="text-wrapper-8" th:text="${reserva.codigoReserva}"></div></th>
        <td class="frame-7" ><div class="text-wrapper-8" th:text="${reserva.fechaReserva}"></div></td>
        <td class="frame-7"><div class="text-wrapper-8"  th:text="${reserva.fechaLimiteRetiro}"></div></td>
        <td class="frame-7"><div class="text-wrapper-8"  th:text="${reserva.estado}"></div></td>
        <td class="frame-7"><div class="text-wrapper-8"  th:text="${reserva.posicionCola}"></div></td>
    </tr>

    </tbody>    
</table>
</html>
