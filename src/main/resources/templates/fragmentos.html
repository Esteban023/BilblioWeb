<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <style>
      /* Estilos para elementos accesibles */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      
      /* Mejoras de focus para accesibilidad */
      .item:focus,
      .login:focus,
      .modal-button:focus {
        outline: 2px solid #c20e1a;
        outline-offset: 2px;
      }
      
      .back:focus {
        outline: 2px solid #4a90e2;
        outline-offset: 2px;
      }

      /* Estilos para los enlaces del footer */
      .footer a {
        color: white;
        text-decoration: none;
      }
      
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Top Bar -->
    <div class="top-bar" th:fragment="top-bar" role="banner" aria-label="Barra superior"></div>

    <!-- Profile Section -->
    <div class="profile" th:fragment="profile">
      <div class="error-message"  th:if="${error}">
        <div th:text="${error}"></div>
        <button onclick="document.querySelector('.error-message').style.display = 'none';"
                  aria-label="Cerrar alerta de error" style="border: none; background-color: transparent; cursor: pointer;">

          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#c20e1a"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
        </button>
      </div>
      <th:block th:if="${errors.size()>0}" th:each="error, iterStat : ${errors}">
        <div th:class="'error-message error-'+${iterStat.count}"  >
          <div th:text="${error}"></div>
          <button th:onclick="document.querySelector('.error-[[${iterStat.count}]]').style.display = 'none';"
                    aria-label="Cerrar alerta de error" style="border: none; background-color: transparent; cursor: pointer;">
  
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#c20e1a"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
          </button>
        </div>

      </th:block>
      <a class="back" href="javascript:history.back()" aria-label="Volver a la página anterior">
        <div class="vector-wrapper">
          <img class="vector" th:src="@{/img/back.svg}" alt="Icono de flecha hacia atrás" />
        </div>
        <div class="text-wrapper">Resultados</div>
      </a>
      
      <div class="frame" th:if="${session.user}" role="img" aria-label="Perfil del usuario">
        <img class="icon" th:src="@{/img/icon.svg}" alt=""/>
      </div>
      
      <a class="login" th:if="${session.user == null}" th:href="@{/login}" aria-label="Iniciar sesión en el sistema">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M479.62-140v-60h268.07q4.62 0 8.46-3.85 3.85-3.84 3.85-8.46v-535.38q0-4.62-3.85-8.46-3.84-3.85-8.46-3.85H479.62v-60h268.07Q778-820 799-799q21 21 21 51.31v535.38Q820-182 799-161q-21 21-51.31 21H479.62Zm-54.23-169.23-41.54-43.39L481.23-450H140v-60h341.23l-97.38-97.38 41.54-43.39L596.15-480 425.39-309.23Z"/></svg>
        Acceder
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer" th:fragment="footer" role="contentinfo" aria-label="Pie de página">
      <div class="content">
        <p class="ref">
          <a href="#" aria-label="Información de contacto">Contacto</a> | 
          <a href="#" aria-label="Enlaces relacionados">Enlaces</a> | 
          <a href="#" aria-label="Obtener ayuda">Ayuda</a><br />
          © 2025 Universidad del Valle
        </p>
      </div>
    </footer>

    <!-- Side Bar -->
<nav class="side-bar" th:fragment="side-bar" role="navigation" aria-label="Menú principal">
  <div class="logo-section">
    <img class="logo-UV" th:src="@{/img/univalle-logo-2.png}" alt="Logo de la Universidad del Valle" />
  </div>
  
  <div class="separador" role="separator" aria-hidden="true"></div>
  <!-- ==== MI PANEL COLAPSABLE ==== -->
  <div class="mipanel-section dropdown-cont">
    <!-- Cabecera clickable -->
    <div class="div-2" 
         role="button" 
         tabindex="0" 
         aria-expanded="false" 
         data-toggle="mi-panel">
      <h2 class="text-wrapper-3">Mi panel</h2>
      <div class="arrow" data-arrow="mi-panel">
        <img class="vector-2" th:src="@{/img/arrow.svg}" alt="" aria-hidden="true" style="rotate: calc(180deg);"/>
      </div>
    </div>
    
    <!-- Menú que se muestra/oculta -->
    <div class="item-section" 
         role="menu" 
         aria-label="Opciones de mi panel"
         data-menu="mi-panel"
         style="display: none;">
         
      <a class="item" th:href="@{/}" role="menuitem" aria-label="Realizar nueva búsqueda">
        <div class="new-search">
          <img class="vector-3" th:src="@{/img/busqueda-black.svg}" alt="" aria-hidden="true"/>
        </div>
        <div class="text-wrapper-4">Nueva Búsqueda</div>
      </a>
      
      <a class="item" th:href="@{/canasta/listar}" role="menuitem" aria-label="Ver mi canasta de recursos">
        <div class="img-wrapper">
          <img class="vector-4" th:src="@{/img/canasta.jpeg}" alt="Icono de canasta" />
        </div>
        <div class="text-wrapper-4">Mi Canasta</div>
      </a>
      
      <a class="item" th:href="@{/prestamo/listar}" role="menuitem" aria-label="Consultar mis préstamos activos">
        <div class="vector-wrapper-2">
          <img class="vector-5" th:src="@{/img/prestamo.jpeg}" alt="Icono de préstamo" />
        </div>
        <div class="text-wrapper-4">Mis Préstamos</div>
      </a>
      
      <a class="item" th:href="@{/reserva/listar}" role="menuitem" aria-label="Ver mis reservas pendientes">
        <div class="vector-wrapper-2">
          <img class="vector-6" th:src="@{/img/reserva.jpeg}" alt="Icono de reserva" />
        </div>
        <div class="text-wrapper-4">Mis Reservas</div>
      </a>
    </div>
  </div>
  <div class="separador" role="separator" aria-hidden="true"></div>
  <!-- herramientas de busqueda -->
  <div class="mipanel-section dropdown-cont">
    <div class="div-2"  
         role="button" 
         tabindex="0" 
         aria-expanded="false" 
         data-toggle="mi-panel">
      <h2 class="text-wrapper-3">Herramientas de busquedad</h2>
      <div class="arrow" data-arrow="mi-panel">
        <img class="vector-2" th:src="@{/img/arrow.svg}" alt="" aria-hidden="true" style="rotate: calc(180deg);"/>
      </div>
    </div>
<!-- Menú que se muestra/oculta -->
    <div class="item-section" role="menu" aria-label="Herramientas de busqueda" data-menu="mi-panel"
      style="display: none; height: 8rem; overflow-y: scroll;">
    
      <div class="dropdown-cont">
        <div class="item" role="button" tabindex="0" aria-expanded="false" data-toggle="mi-panel">
          <div class="vector-wrapper-2" data-arrow="mi-panel"><img class="vector-2" th:src="@{/img/arrow.svg}" alt="" aria-hidden="true"
              style="rotate: calc(180deg);" /></div>
          <span class="text-wrapper-4">Filtrar por Autor</span>
        </div>
        <div role="menu" aria-label="Opciones para Autores" data-menu="mi-panel" style="display: none;" id="autoresFrag">
          <th:block th:if="${autors}">
              <label class="item" th:each="autor : ${autors}" th:for="${'autor' + autor.id}">
                <input  type="checkbox" name="autorOpcFilter" th:id="${'autor' + autor.id}" th:value="${autor.id}">
                <span class="text-wrapper-4" th:text="${autor.nombre + ' '  +autor.apellido}"></span>
              </label>
             
          </th:block>
          <label class="item" th:if="${autors ==null}"><span class="text-wrapper-4">Realice una busqueda</span></label>
        </div>
      </div>
      <div class="dropdown-cont">
        <div class="item" role="button" tabindex="0" aria-expanded="false" data-toggle="mi-panel">
          <div class="vector-wrapper-2" data-arrow="mi-panel"><img class="vector-2" th:src="@{/img/arrow.svg}" alt="" aria-hidden="true"
              style="rotate: calc(180deg);" /></div>
          <span class="text-wrapper-4">Filtrar por Categoria</span>
        </div>
        <div role="menu" aria-label="Opciones para categotia" data-menu="mi-panel" style="display: none;">
          <label class="item" for="categoria1">
            <input  type="checkbox" name="categoriaOpcFilter" id="categoria1" value="general">
            <span class="text-wrapper-4"> General</span>
          </label>
          <label class="item" for="categoria2">
            <input  type="checkbox" name="categoriaOpcFilter" id="categoria2" value="reserva">
            <span class="text-wrapper-4"> Reserva</span>
          </label>
        </div>
      </div>
      <div class="dropdown-cont">
        <label class="item" for="filterISBN">
            <input  type="checkbox" name="IsbnOpcFilter" id="filterISBN" value="ISBN">
            <span class="text-wrapper-4"> Filtrar por ISBN</span>
        </label>
      </div>
    </div>
  </div>
  <div class="separador" role="separator" aria-hidden="true"></div>
  <a class="login" style="margin-bottom: 10px;" th:if="${session.user}" th:href="@{/logout}" aria-label="Cerrar sesión del sistema">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
      <path d="M212.31-140Q182-140 161-161q-21-21-21-51.31v-535.38Q140-778 161-799q21-21 51.31-21h268.07v60H212.31q-4.62 0-8.46 3.85-3.85 3.84-3.85 8.46v535.38q0 4.62 3.85 8.46 3.84 3.85 8.46 3.85h268.07v60H212.31Zm436.92-169.23-41.54-43.39L705.08-450H363.85v-60h341.23l-97.39-97.38 41.54-43.39L820-480 649.23-309.23Z"/>
    </svg>
    Cerrar sesión
  </a>
</nav>

    <!-- Modal Fragment -->
    <th:block th:fragment="modal-resultado">
      <div class="modal-overlay" th:if="${mensajeModal}" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-box">
          <div class="modal-icon" role="img" aria-label="Operación exitosa">
            <svg xmlns="http://www.w3.org/2000/svg" height="50px" viewBox="0 -960 960 960" width="50px" fill="#FFFFFF" aria-hidden="true">
              <path d="M382-232.35 146.35-468l64.89-64.89L382-362.13l366.76-366.76L813.65-664 382-232.35Z"/>
            </svg>
          </div>
          
          <div class="text-contenedor">
            <h2 class="modal-title" id="modal-title" th:text="${tituloModal}"></h2>
            <p class="modal-message" th:text="${mensajeModal}"></p>
            
            <div class="time-contenedor" th:if="${mensajeTime}" role="status">
              <img th:src="@{/img/time.svg}" class="time-img" alt="Icono de tiempo" aria-hidden="true">
              <p class="time-text" th:text="${mensajeTime}"></p>
            </div>
          </div>

          <button class="modal-button" 
                  onclick="document.querySelector('.modal-overlay').style.display = 'none';"
                  aria-label="Cerrar ventana de mensaje">
            Cerrar
          </button>
        </div>
      </div>
    </th:block>
    <!-- fragemnto para la busquedad sin recarga -->
    <th:block th:fragment="busq-result">
      <div class="nav-result-wrapper" id="navResultFrag" hx-swap-oob="innerHTML">
        <div class="nav-result">
          <div class="div-wrapper">
            <div class="text-wrapper"><span th:text="${resultados.size()}"></span> Resultados</div>
          </div>
          <div class="div">
            <p class="p">Resultados de búsqueda para “<span th:text="${palabra}"></span>”</p>
          </div>
        </div>
      </div>
      <div class="result-content" id="resultadoFrag"  hx-swap-oob="outerHTML">
    
        <div class="result" th:each="resultado, iterStat : ${resultados}">
          <div class="numero">
            <div class="text-wrapper-2" th:text="${iterStat.count} + ' .'"></div>
          </div>
          <div class="contenido">
            <a class="text-wrapper-3" th:text="${resultado.titulo}"
              th:href="@{/buscar/{titulo}(titulo = ${resultado.titulo})}"></a>
            <p class="text-wrapper-4" th:text="${resultado.getAutoresString()}"></p>
            <div class="icon-text">
              <div class="vector-wrapper"><img class="vector-2" th:src="@{/img/libros.svg}" /></div>
              <div class="frame-2">
                <div class="text-wrapper-5" th:text="${resultado.tipoDePublicacion}"></div>
              </div>
            </div>
            <div class="text-wrapper-6">Ejemplares: 2</div>
          </div>
        </div>
    
      </div>
      <div th:if="${autors.size > 1}" id="autoresFrag" hx-swap-oob="innerHTML">
        <th:block>
              <label class="item" th:each="autor : ${autors}" th:for="${'autor' + autor.id}">
                <input  type="checkbox" name="autorOpcFilter" th:id="${'autor' + autor.id}" th:value="${autor.id}">
                <span class="text-wrapper-4" th:text="${autor.nombre + ' '  +autor.apellido}"></span>
              </label>
             
          </th:block>
      </div>
    </th:block>
  </div>
  
  </body>

</html>
