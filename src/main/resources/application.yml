name: Run Tests

on:
  push:
    branches: [ "agregar-thymeleaf" ]
  pull_request:
    branches: [ "agregar-thymeleaf" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies and run tests
        run: mvn -B test
