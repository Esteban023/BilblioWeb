<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
    <link rel="stylesheet" th:href="@{/css/tablas.css}" />
</head>
<body>
  <div th:replace="~{fragmentos :: top-bar}"></div>
  <div class="container">
    <div class="home-page">
      <div class="main-content">
        <div th:replace="~{fragmentos :: profile}"></div>
        <div class="search">
            
            <div class="frame-4">
                <div class="frame-5"><div class="text-wrapper-6">Ejemplares que actualmente tiene en <span th:text="${prestamos != null ? 'Préstamos' : 'Reservas'}"></span>:</div></div>
                <table th:replace="~{tablaTemporal :: tabla}"></table>                
            </div>
        </div>
        <footer th:replace="~{fragmentos :: footer}"></footer>
      </div>
    </div>
    <div th:replace="~{fragmentos :: side-bar}"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        document
          .querySelectorAll('[data-toggle="mi-panel"]')
          .forEach((toggle) => {
            const menu = toggle
              .closest(".mipanel-section")
              .querySelector('[data-menu="mi-panel"]');
            const arrow = toggle.querySelector('[data-arrow="mi-panel"]');

            if (!menu || !arrow) return;

            const abrir = () => {
              menu.style.display = "block";
              toggle.setAttribute("aria-expanded", "true");
              arrow.style.transform = "rotate(180deg)";
            };

            const cerrar = () => {
              menu.style.display = "none";
              toggle.setAttribute("aria-expanded", "false");
              arrow.style.transform = "rotate(0deg)";
            };

            toggle.addEventListener("click", () => {
              menu.style.display === "block" ? cerrar() : abrir();
            });

            toggle.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggle.click();
              }
            });
          });
        });
  </script>
</body>
</html>
